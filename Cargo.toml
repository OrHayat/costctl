[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OrHayat/costctl"

[workspace.dependencies]
# Declared here and inherited by members; each branch adds only what it uses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
